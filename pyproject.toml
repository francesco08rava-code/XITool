[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xitool"
dynamic = ["version", "dependencies"]
description = "Ricognizione web e verifiche su scope esplicitamente autorizzato"
requires-python = ">=3.10"

[project.scripts]
XITool = "xitool.cli:entrypoint"

[tool.setuptools]
packages = ["xitool"]

[tool.setuptools.dynamic]
version = {attr = "xitool.__version__"}
dependencies = {file = ["requirements.txt"]}
